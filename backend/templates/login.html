{% extends "base.html" %}

{% block title %}登录 - 徕欧科技管理系统{% endblock %}

{% block content %}
<style>
    .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-bg);
        padding: 20px;
    }

    .login-box {
        width: 100%;
        max-width: 400px;
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        border: 1px solid var(--color-border-light);
        padding: 48px;
    }

    .login-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .login-logo {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
    }

    .login-logo span {
        font-weight: 400;
        color: var(--color-text-secondary);
    }

    .login-subtitle {
        color: var(--color-text-secondary);
        font-size: 14px;
    }

    .login-form .form-group {
        margin-bottom: 20px;
    }

    .login-form .form-label {
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
        display: block;
    }

    .login-form .form-input {
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        background: var(--color-surface);
        transition: var(--transition);
    }

    .login-form .form-input:focus {
        outline: none;
        border-color: var(--color-text);
    }

    .login-btn {
        width: 100%;
        padding: 14px;
        font-size: 15px;
        font-weight: 500;
        background: var(--color-btn-bg);
        color: var(--color-surface);
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: var(--transition);
        margin-top: 8px;
    }

    .login-btn:hover {
        transform: translateY(-2px);

    }

    .alert {
        padding: 12px 16px;
        border-radius: var(--radius-md);
        margin-bottom: 20px;
        font-size: 14px;
    }

    .alert-error {
        background: rgba(220, 38, 38, 0.08);
        color: var(--color-danger);
        border: 1px solid rgba(220, 38, 38, 0.2);
    }
</style>

<div class="login-page">
    <div class="login-box">
        <div class="login-header">
            <div class="login-logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="徕欧科技"
                    style="max-width: 180px; height: auto;">
            </div>
            <div class="login-subtitle">后台管理系统</div>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-error">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form class="login-form" method="POST" action="{{ url_for('admin_login') }}">
            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-input" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-input" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="login-btn">登录</button>
        </form>
    </div>
</div>
{% endblock %}
